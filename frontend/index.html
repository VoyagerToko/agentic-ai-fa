<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus · Knowledge Network</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230B1230'/><path d='M5 9l9 6' stroke='%23E21D2D' stroke-width='3'/><path d='M27 7l-9 8' stroke='%232F6BFF' stroke-width='3'/><path d='M16 27v-8' stroke='%2322B14C' stroke-width='3'/><circle cx='16' cy='16' r='4.5' fill='%230B1230' stroke='%23F4F1EA' stroke-width='2.5'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/force-graph@1.52.0/dist/force-graph.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
</head>
<body>
  <!-- Left rail: brand, navigation, live system status -->
  <aside class="rail">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 9l11 7" stroke="#E21D2D"/><path d="M29 6 18 16" stroke="#2F6BFF"/><path d="M16 29V19" stroke="#22B14C"/><circle cx="16" cy="16" r="5" fill="#0B1230" stroke="#F4F1EA" stroke-width="3"/></svg>
      <div><b>NEXUS</b><span>KNOWLEDGE NETWORK</span></div>
    </div>
    <i class="band" aria-hidden="true"></i>
    <nav id="nav" aria-label="Views">
      <button data-view="agent" class="on" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H16a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7.5"/></svg>Agent</button>
      <button data-view="graph"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M10.8 7.2 6.2 16.8M13.2 7.2l4.6 9.6M7.5 19h9"/></svg>Graph</button>
      <button data-view="mcp"><svg viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0V8ZM12 17v5"/></svg>MCP</button>
    </nav>
    <section class="status" aria-label="System status">
      <h2><i id="statusLamp" class="lamp"></i>System status</h2>
      <dl>
        <div><dt>Model</dt><dd id="sModel">–</dd></div>
        <div><dt>Graph</dt><dd id="sGraph">–</dd></div>
        <div><dt>Semantic index</dt><dd id="sIndex">–</dd></div>
        <div><dt>Review queue</dt><dd id="sReview">–</dd></div>
      </dl>
    </section>
  </aside>

  <!-- AGENT: the journey (steps) on the left, the live map on the right -->
  <main id="agent" class="view on">
    <section class="journey">
      <div id="log" class="log" aria-live="polite"></div>
      <form id="ask" class="ask">
        <label class="field">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="question" placeholder="Ask about services, teams, people, standards…" autocomplete="off" aria-label="Question">
        </label>
        <button class="btn primary" id="askBtn">Ask <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <button type="button" class="btn ghost" id="newChat" title="Start a new conversation">New</button>
      </form>
    </section>
    <section class="mapcol">
      <header class="runbar">
        <span id="runState" class="tag">Idle</span>
        <dl class="runstats">
          <div><dt>Entities</dt><dd id="rStations">0</dd></div>
          <div><dt>Tool calls</dt><dd id="rTools">0</dd></div>
          <div><dt>Rounds</dt><dd id="rRounds">0</dd></div>
          <div><dt>Elapsed</dt><dd id="rTime">0.0 s</dd></div>
        </dl>
      </header>
      <div class="map" id="agentMap"></div>
      <div class="legend" id="agentLegend"></div>
      <div class="zoom" data-map="agent">
        <button class="sq" data-zoom="fit" title="Fit route"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></button>
        <button class="sq" data-zoom="in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="sq" data-zoom="out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      </div>
    </section>
  </main>

  <!-- GRAPH: the whole network; search by name or meaning; station card or review queue on the right -->
  <main id="graph" class="view">
    <section class="mapcol">
      <header class="graphbar">
        <div class="searchbox">
          <label class="field">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="find" placeholder="Find a station by name or meaning…" autocomplete="off" aria-label="Search the graph">
          </label>
          <ul id="results" class="results" hidden></ul>
        </div>
        <div class="lines" id="lines" aria-label="Filter by type"></div>
      </header>
      <div class="map" id="graphMap"></div>
      <div class="zoom" data-map="graph">
        <button class="sq" data-zoom="fit" title="Fit all"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></button>
        <button class="sq" data-zoom="in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="sq" data-zoom="out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      </div>
    </section>
    <aside class="side" id="side"></aside>
  </main>

  <!-- MCP: connect Claude to the same tools -->
  <main id="mcp" class="view">
    <div class="page" id="mcpPage"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
